# Realtime robot deployment config for dualsystem.real_robot_run.
#
# Launch:
#   PYTHONPATH=. python -m dualsystem.real_robot_run \
#     --config examples/config_real_robot.yaml \
#     --reset-session

enable_memory: true
frequency: 1
planning_mode: subtask_selection
session_dir: ~/.dualsystem/sessions

real_robot:
  task: "Organize the desk and ensure no items are left scattered."
  session_id: real-robot-001
  image_dir: /tmp/img
  camera_files:
    cam_high: base_0_rgb.jpg
    cam_left_wrist: left_wrist_0_rgb.jpg
    cam_right_wrist: right_wrist_0_rgb.jpg
  control_hz: 1.0
  max_steps:
  wait_timeout: 5.0
  poll_interval: 0.05
  stop_status: done
  dry_run: false

vlm:
  provider: local_qwen
  model_path: /mnt/public1/ljx_test/ViFailback/checkpoints/Qwen3-VL-8B-Instruct
  model_family: qwen3
  dtype: bf16
  device: cuda:0
  min_pixels: 200704
  max_pixels: 1003520
  sampling_params:
    temperature: 1.0
    top_p: 0.95
    max_new_tokens: 512

# vlm:
#   provider: openai_compatible
#   model: gemini-3.5-flash
#   base_url: https://your-provider.example/v1
#   api_key: YOUR_API_KEY_HERE
#   sampling_params:
#     temperature: 0.2
#     max_new_tokens: 512
executor:
  provider: http
  endpoint: http://localhost:8000/execute
  timeout: 30

logging:
  enabled: true
  run_dir: ./runs
  copy_images: true
