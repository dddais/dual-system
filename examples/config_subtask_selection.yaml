enable_memory: true
frequency: 1
planning_mode: subtask_selection
session_dir: ~/.dualsystem/sessions

vlm:
  provider: openai_compatible
  model: qwen-vl
  base_url: https://your-provider.example/v1
  api_key: ${OPENAI_API_KEY}
  sampling_params:
    temperature: 0.2
    max_new_tokens: 512

executor:
  provider: http
  endpoint: http://localhost:8000/execute
  timeout: 30

logging:
  enabled: true
  run_dir: ./runs
  copy_images: false
